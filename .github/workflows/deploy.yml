
name: NimbusCloud Platform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./services/booking-api
        run: npm ci

      - name: Run ESLint
        working-directory: ./services/booking-api
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./services/booking-api
        run: npm ci

      - name: Run tests
        working-directory: ./services/booking-api
        run: npm test -- --passWithNoTests

  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push booking-api
        uses: docker/build-push-action@v5
        with:
          context: ./services/booking-api
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}/booking-api:{1}', steps.login-ecr.outputs.registry, github.sha) || 'booking-api:pr-check' }}

      - name: Build and push payment-api
        uses: docker/build-push-action@v5
        with:
          context: ./services/payment-api
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}/payment-api:{1}', steps.login-ecr.outputs.registry, github.sha) || 'payment-api:pr-check' }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}/auth-service:{1}', steps.login-ecr.outputs.registry, github.sha) || 'auth-service:pr-check' }}

      - name: Build and push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/notification-service
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}/notification-service:{1}', steps.login-ecr.outputs.registry, github.sha) || 'notification-service:pr-check' }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${{ env.AWS_REGION }}" \
            --name nimbuscloud-platform-cluster

      - name: Deploy to Kubernetes
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/booking-api \
            booking-api="$ECR_REGISTRY/booking-api:$IMAGE_TAG"

          kubectl set image deployment/payment-api \
            payment-api="$ECR_REGISTRY/payment-api:$IMAGE_TAG"

          kubectl set image deployment/auth-service \
            auth-service="$ECR_REGISTRY/auth-service:$IMAGE_TAG"

          kubectl set image deployment/notification-service \
            notification-service="$ECR_REGISTRY/notification-service:$IMAGE_TAG"

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/booking-api --timeout=120s
          kubectl rollout status deployment/payment-api --timeout=120s
          kubectl rollout status deployment/auth-service --timeout=120s
          kubectl rollout status deployment/notification-service --timeout=120s
